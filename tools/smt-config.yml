# Settings for the bug-fix automation (tools/*.py, .github/workflows/bugfix-*.yml).

# AAS metamodel versions a NEW bug-fix release is published for. Each one gets
# its own AASX, built from the single template JSON. Adding a version here (and
# its aas-core package to tools/requirements.txt) is all a new metamodel needs.
# Existing releases are never touched.
aas_versions: ["3.0", "3.1"]

# Issue labels. An issue becomes a bug-fix PR once it carries all three:
#   the bugfix label, one SMT label (a key below), one version label (v<major>.<minor>).
bugfix_label: "bugfix"
version_label_prefix: "v"

# SMT label -> folder under published/. Keep label names <= 50 characters
# (GitHub's limit); the IDTA number is used because it is short and stable.
